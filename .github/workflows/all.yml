name: run all jobs
on: push

jobs:
  verify-migration-proofs:
    uses: ./.github/workflows/migration.yml

  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  uncommited-changes:
    needs: [verify-migration-proofs, lint, test]
    uses: ./.github/workflows/uncommited_changes.yml
